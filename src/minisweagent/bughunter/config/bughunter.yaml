agent:
  system_template: |
    You are a helpful security engineering assistant that can interact with a computer.
  instance_template: |
    Please solve this issue: {{task}}

    You interact by calling the tools you are given. You always have the `bash` tool for
    running shell commands. Additional function and MCP tools may be available; their names
    are prefixed with the server they come from (for example `fetch__fetch`).

    For remote hosts, use the dedicated SSH tools (`ssh_connect`, `ssh_exec`, `ssh_upload`,
    `ssh_download`, `ssh_disconnect`) instead of the local `ssh`/`scp` binaries.

    ## Recommended workflow
    1. Inspect the codebase and understand the issue.
    2. Reproduce the issue with a script or command.
    3. Implement and verify a fix.
    4. Finish by calling the `submit` tool with a concise summary, or by running
       `echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT` as the only bash command.
  step_limit: 0
  cost_limit: 3.0
  mode: confirm
model:
  observation_template: |
    {%- if output.output | length < 10000 -%}
    {
      "returncode": {{ output.returncode }},
      "output": {{ output.output | tojson }}{% if output.exception_info %},
      "exception_info": {{ output.exception_info | tojson }}{% endif %}
    }
    {%- else -%}
    {
      "returncode": {{ output.returncode }},
      "output_head": {{ output.output[:5000] | tojson }},
      "output_tail": {{ output.output[-5000:] | tojson }},
      "elided_chars": {{ output.output | length - 10000 }},
      "warning": "Output too long."
      {%- if output.exception_info %}, "exception_info": {{ output.exception_info | tojson }}{% endif %}
    }
    {%- endif -%}
  format_error_template: |
    Tool call error:

    <error>
    {{error}}
    </error>

    Every response must include at least one tool call. Call the `bash` tool with
    `{"command": "your command"}`, or call one of the other available tools with valid arguments.
  model_kwargs:
    drop_params: true
environment:
  environment_class: local
  env:
    PAGER: cat
    MANPAGER: cat
    LESS: -R
tools:
  # Local Python functions from minisweagent.bughunter.tools.functions.
  functions: true
  # Static guardrail on binaries the bash tool may execute. This is not a sandbox:
  # interpreters and command substitution can bypass it -- use the docker environment
  # for real isolation. mode: blocklist | whitelist | off.
  binary_policy:
    mode: blocklist
    # blocklist: [...]   # replaces the default high-risk set (ssh, nc, curl, sudo, ...)
    # whitelist: [...]   # used when mode: whitelist; commands outside it are blocked
  # SSH tools backed by asyncssh (ssh_connect/ssh_disconnect/ssh_exec/ssh_upload/ssh_download).
  ssh:
    enabled: true
    connect_timeout: 30
    timeout: 30
    # Set to "none" to skip host key verification (e.g. for ephemeral lab targets).
    # known_hosts: "none"
    hosts:
      # Named host profiles let the model connect without seeing credentials:
      # target:
      #   host: 10.0.0.5
      #   username: root
      #   port: 22
      #   private_key: ~/.ssh/id_ed25519
      #   password_env: SSH_PASSWORD
  # MCP servers are defined once in the global config (~/.config/mini-swe-agent/bughunter.yaml)
  # and enabled by group so the advertised tool list stays small. Definitions live in the
  # catalog; nothing is exposed until it is listed in `mcp_servers` (or an enabled group).
  mcp_server_catalog:
    fetch:
      command: uvx
      args: [mcp-server-fetch]
    # shodan:
    #   url: https://mcp.shodan.io/mcp
    #   headers: {Authorization: "Bearer ${SHODAN_API_KEY}"}
  mcp_server_groups:
    web: [fetch]
    # recon: [fetch, shodan]
  # Enable groups or individual servers here, e.g.:
  # mcp_servers: [web]

