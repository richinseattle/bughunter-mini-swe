# Example LLM service file.
#
# Copy to your global config dir and edit:
#   cp llm.example.yaml ~/.config/mini-swe-agent/llm.yaml
#
# Loaded by default from ~/.config/mini-swe-agent/llm.yaml and ./llm.yaml; pass extra
# files with `bughunter -L path/to/llm.yaml`. Values may reference environment variables
# or a .env file (loaded by default) as ${VAR}.
#
# Select a service with `--service NAME`, the BUGHUNTER_SERVICE env var, or
# `default_service` below. API keys are kept out of the saved trajectory.

default_service: deepseek

services:
  deepseek:
    model: deepseek/deepseek-flash
    api_base: https://api.deepseek.com
    api_key_env: DEEPSEEK_API_KEY          # read from env/.env
  openai:
    model: openai/gpt-5.4
    api_key: ${OPENAI_API_KEY}             # inline expansion from env/.env
  local:
    model: openai/qwen3-coder
    api_base: http://localhost:8000/v1
    api_key: ${LOCAL_API_KEY}
    model_kwargs:
      drop_params: true
  azure:
    model: azure/my-deployment
    api_base: https://my-resource.openai.azure.com
    api_key_env: AZURE_API_KEY
    model_kwargs:
      api_version: "2024-10-21"
